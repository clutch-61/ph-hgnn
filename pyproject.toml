[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ph-hgnn"
version = "0.1.0"
description = "Persistent-homology residuals for finite-hop hypergraph neural networks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "PH-HGNN Authors" }]
dependencies = [
  "gudhi>=3.11",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "tensorboard>=2.18",
]

[project.scripts]
ph-hgnn = "ph_hgnn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ph_hgnn"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ph_hgnn"]
